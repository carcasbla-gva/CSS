<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tarjeta de Perfil de Usuario</title>
    <link rel="stylesheet" href="EjercicioFinal.css">
</head>
<body>

    <div class="tarjeta-perfil">
        <div class="tarjeta-header">
            <img src="baixa.jpeg" alt="Foto de perfil">
            <h2>Nombre del Usuario</h2>
        </div>
        <div class="tarjeta-cuerpo">
            <p>Una breve descripción sobre el usuario, sus intereses y su profesión.</p>
            <h3>Habilidades</h3>
            <ul class="lista-habilidades">
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Flexbox</li>
                <li>Grid</li>
                <li>Responsive</li>
            </ul>
        </div>
        <div class="tarjeta-footer">
            <a href="#">Contactar</a>
        </div>
    </div>
</body>
</html>
